<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Tower — pair your phone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<link rel="stylesheet" href="/styles.css">
<style>
.pairbody { max-width: 820px; margin: 0 auto; padding: 0 20px 60px; }
.ph { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; padding: 30px 0 22px; }
.ph > div { flex: 1 1 26ch; min-width: 0; }
.ph-eyebrow { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); }
.ph h1 { margin: 0 0 8px; font-size: 25px; letter-spacing: -.01em; text-wrap: balance; }
.ph p { margin: 0; max-width: 60ch; color: var(--text-dim); font-size: 14.5px; line-height: 1.6; }
.ph-back {
  flex: 0 0 auto; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px;
  color: var(--text-dim); text-decoration: none; font-size: 13px;
}
.ph-back:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }

.codes { display: flex; gap: 16px; flex-wrap: wrap; }
.qcard {
  flex: 1 1 300px; min-width: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; text-align: center;
}
.qcard h2 { margin: 0 0 3px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); }
.qcard .net { margin: 0 0 14px; font-size: 12.5px; color: var(--text-dim); }
/* White quiet zone always, in both themes: a scanner wants the contrast the code was made with. */
.qwrap { background: #fff; border-radius: 10px; padding: 10px; display: inline-block; line-height: 0; }
.qwrap svg { width: 210px; height: 210px; max-width: 100%; }
.qurl {
  margin: 14px 0 0; font: 12.5px/1.5 var(--mono); color: var(--text-dim);
  word-break: break-all; user-select: all;
}
.qcopy {
  margin-top: 11px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel-2); color: var(--text); font: 600 13px inherit; cursor: pointer;
}
.qcopy:hover { border-color: var(--accent); color: var(--accent); }

.keyrow {
  margin: 20px 0 0; padding: 15px 18px; display: flex; gap: 14px; align-items: center;
  flex-wrap: wrap; background: var(--bg-soft); border: 1px solid var(--line-soft); border-radius: var(--radius);
}
.keyrow b { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); font-weight: 600; }
.keyrow code { font: 700 21px/1 var(--mono); letter-spacing: .16em; color: var(--accent); }
.keyrow span { color: var(--text-dim); font-size: 13px; }

.steps { margin: 26px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li {
  position: relative; padding: 0 0 14px 34px; counter-increment: s;
  color: var(--text-dim); font-size: 14px; line-height: 1.6;
}
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 1px; width: 22px; height: 22px;
  display: grid; place-items: center; border-radius: 50%; background: var(--panel-2);
  border: 1px solid var(--line); color: var(--text-faint); font: 600 11.5px/1 var(--mono);
}
.steps b { color: var(--text); font-weight: 600; }

.off { margin: 24px 0 0; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.off h2 { margin: 0 0 8px; font-size: 16px; }
.off p { margin: 0 0 12px; color: var(--text-dim); font-size: 14px; line-height: 1.6; }
.off code { font: 13px var(--mono); background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 2px 6px; }
.fine { margin: 26px 0 0; color: var(--text-faint); font-size: 12.5px; line-height: 1.7; }
@media (max-width: 620px) { .pairbody { padding: 0 14px 50px; } .ph h1 { font-size: 21px; } }
</style>
</head>
<body class="pairbody">

<header class="ph">
  <div>
    <p class="ph-eyebrow">Control Tower</p>
    <h1>Pair your phone</h1>
    <p id="intro">Point the camera at a code. It opens the same dashboard, already unlocked — the
       access code travels in the link, so there is nothing to type.</p>
  </div>
  <a class="ph-back" href="/">← back to the board</a>
</header>

<div id="codes" class="codes"></div>
<div id="off"></div>

<script src="/qr.js"></script>
<script>
const PHONE = __FLEET_PHONE__;
const codes = document.getElementById('codes');

function card(url) {
  const el = document.createElement('div');
  el.className = 'qcard';
  const ip = url.match(/\/\/([^:/]+)/)?.[1] || url;
  // 192.168.x and 10.x are both routable here; naming them saves guessing which network to be on.
  const kind = /^192\.168\./.test(ip) ? 'home or office Wi-Fi'
    : /^10\./.test(ip) ? 'company network'
    : /^172\.(1[6-9]|2\d|3[01])\./.test(ip) ? 'private network' : 'this machine';
  el.innerHTML = `<h2>${ip}</h2><p class="net">${kind}</p>`;

  try {
    // Level Q: a phone screen is small and a camera is often at an angle, so buy the extra
    // tolerance — a pairing URL is short enough that it costs nothing.
    const wrap = document.createElement('div');
    wrap.className = 'qwrap';
    wrap.append(QR.svg(url, { level: 'Q' }));
    el.append(wrap);
  } catch (e) {
    const said = document.createElement('p');
    said.className = 'qurl';
    said.textContent = 'could not draw a code — use the link below. (' + e.message + ')';
    el.append(said);
  }

  const text = document.createElement('p');
  text.className = 'qurl';
  text.textContent = url;
  const btn = document.createElement('button');
  btn.className = 'qcopy';
  btn.textContent = 'Copy the link';
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); btn.textContent = 'Copied'; }
    catch { btn.textContent = 'Select the text above'; }
    setTimeout(() => { btn.textContent = 'Copy the link'; }, 1800);
  });
  el.append(text, btn);
  return el;
}

if (PHONE && PHONE.urls && PHONE.urls.length) {
  for (const url of PHONE.urls) codes.append(card(url));

  const key = document.createElement('div');
  key.className = 'keyrow';
  key.innerHTML = `<b>access code</b><code>${PHONE.code}</code>
    <span>Only needed if you type the address by hand. Each device is asked once, then remembered
    for thirty days.</span>`;
  const steps = document.createElement('ol');
  steps.className = 'steps';
  steps.innerHTML = `
    <li>Put the phone on <b>the same network as this PC</b> — a code will not open over mobile data.</li>
    <li>Open the camera and hold it over one of the codes above.</li>
    <li>Tap the link. If it does not load, try the other code — that network is not the one you are on.</li>
    <li>Add it to the home screen and it behaves like an app.</li>`;
  const fine = document.createElement('p');
  fine.className = 'fine';
  fine.innerHTML = `A paired phone can read everything and reply to any session, but it cannot start a
    session with prompts turned off — that stance is refused for anything not on this machine.
    Your sections, theme and dismissals live on the server, so the phone shows the same board.
    Anyone on this network who has the link is in: it is an access code, not an account.`;
  document.getElementById('off').append(key, steps, fine);
} else {
  // Nothing to point a camera at, so the opening line should not promise one.
  document.getElementById('intro').textContent =
    'This is where the codes for your phone appear. There are none yet, because the server is not '
    + 'reachable from anywhere but this PC.';
  document.getElementById('off').innerHTML = `
    <div class="off">
      <h2>Phone access is off for this run</h2>
      <p>The server is listening on this machine only, so there is no address a phone could reach and
         nothing to put in a code.</p>
      <p>Close the server window and start it with <code>start-phone.cmd</code> instead. It opens the
         port to your local network, mints an access code, and this page fills in.</p>
      <p><a class="ph-back" href="/help.html#phone">what that changes →</a></p>
    </div>`;
}
</script>
</body>
</html>
